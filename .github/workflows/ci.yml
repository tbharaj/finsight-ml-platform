name: Python quality checks
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and test dependencies
        run: python -m pip install -e '.[api,dev,intelligence]'
      - name: Unit tests (offline fixtures)
        run: python -m pytest -q
      - name: Check syntax
        run: python -m compileall -q src intelligence_dashboard.py

  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook dependencies
        run: python -m pip install -e '.[notebook]'
      - name: Run notebook with offline synthetic fixtures
        env:
          FINSIGHT_NOTEBOOK_SOURCE: synthetic
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          path = Path("notebooks/FinSight_Financial_Sentiment.ipynb")
          nb = nbformat.read(path, as_version=4)
          result = NotebookClient(
              nb,
              timeout=180,
              kernel_name="python3",
              resources={"metadata": {"path": str(path.parent)}},
              allow_errors=False,
          ).execute()
          assert result.cells
          print("Notebook executed successfully against synthetic fixtures.")
          PY
